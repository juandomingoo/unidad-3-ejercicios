<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Módulo 02 · AR.js · Atrapanieblas en tu mesa</title>
  <!-- A-Frame (construido sobre Three.js) + AR.js con seguimiento de marcador -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.5/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; }
    #info {
      position: fixed; z-index: 10; left: 12px; right: 12px; bottom: 12px;
      background: rgba(244,237,225,.92); color: #2b2420; border-radius: 12px;
      padding: 10px 14px; font-size: 15px; line-height: 1.35;
    }
    #info b { color: #b5562e; }
  </style>
  <script>
    // Componente: gotas que caen por la malla y vuelven a empezar (animación con Three.js)
    AFRAME.registerComponent('gotas', {
      schema: { cantidad: { default: 40 } },
      init() {
        const THREE = AFRAME.THREE;
        this.drops = [];
        const geo = new THREE.SphereGeometry(0.03, 8, 6);
        const mat = new THREE.MeshStandardMaterial({ color: '#7cc7ff', roughness: 0.1 });
        for (let i = 0; i < this.data.cantidad; i++) {
          const m = new THREE.Mesh(geo, mat);
          this.reset(m, true);
          this.el.object3D.add(m);
          this.drops.push(m);
        }
      },
      reset(m, anywhere) {
        m.position.set((Math.random() - 0.5) * 1.5, anywhere ? 0.2 + Math.random() * 0.9 : 1.1, 0.03);
        m.userData.v = 0.1 + Math.random() * 0.25;
      },
      tick(t, dt) {
        const s = dt / 1000;
        for (const m of this.drops) {
          m.position.y -= m.userData.v * s;
          if (m.position.y < 0.2) this.reset(m, false);
        }
      },
    });

    // Componente: el agua del estanque sube y baja suavemente
    AFRAME.registerComponent('nivel-agua', {
      tick(t) {
        const k = 0.35 + 0.3 * (0.5 + 0.5 * Math.sin(t / 1500));
        this.el.object3D.scale.y = k;
      },
    });
  </script>
</head>
<body>
  <div id="info">
    <b>Atrapanieblas en tu mesa.</b> Apunta la cámara al marcador <b>Hiro</b> (hiro.png, impreso o en otra pantalla).
    La malla atrapa las gotas de la camanchaca y las lleva al estanque.
  </div>

  <a-scene embedded vr-mode-ui="enabled: false"
           arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix;"
           renderer="antialias: true; alpha: true">

    <a-marker preset="hiro">
      <!-- Base de arena -->
      <a-cylinder radius="1.1" height="0.08" color="#d2b48a" position="0 0.04 0"></a-cylinder>

      <!-- Postes -->
      <a-cylinder radius="0.03" height="1.3" color="#5b4636" position="-0.8 0.65 0"></a-cylinder>
      <a-cylinder radius="0.03" height="1.3" color="#5b4636" position="0.8 0.65 0"></a-cylinder>

      <!-- Malla (semitransparente) y canaleta -->
      <a-plane width="1.6" height="0.9" position="0 0.7 0" color="#22302a" opacity="0.55"
               material="side: double; transparent: true"></a-plane>
      <a-box width="1.6" height="0.05" depth="0.1" position="0 0.22 0" color="#9aa3a8"></a-box>
      <a-entity gotas="cantidad: 40"></a-entity>

      <!-- Estanque -->
      <a-cylinder radius="0.22" height="0.5" position="0.55 0.33 0.55" color="#e8eef0" opacity="0.4"
                  material="transparent: true; side: double" open-ended="true"></a-cylinder>
      <a-entity position="0.55 0.09 0.55">
        <a-cylinder radius="0.2" height="0.45" position="0 0.225 0" color="#3d8fd1" nivel-agua></a-cylinder>
      </a-entity>

      <!-- Etiqueta -->
      <a-text value="ATRAPANIEBLAS" align="center" color="#2b2420" width="3"
              position="0 1.45 0"></a-text>
      <a-text value="Carlos Espinosa - Antofagasta, 1956" align="center" color="#b5562e" width="2"
              position="0 1.3 0"></a-text>
    </a-marker>

    <a-entity camera></a-entity>
    <a-light type="ambient" intensity="0.8"></a-light>
    <a-light type="directional" position="1 2 1" intensity="0.8"></a-light>
  </a-scene>
</body>
</html>
