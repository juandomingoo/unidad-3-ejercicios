<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Módulo 03 · A-Frame · Mirador de la camanchaca</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script>
    // Hotspot: al mirarlo fijo (gaze) o hacer clic, muestra/oculta su panel de información
    AFRAME.registerComponent('hotspot', {
      schema: { panel: { type: 'selector' } },
      init() {
        const panel = this.data.panel;
        panel.setAttribute('visible', false);
        this.el.addEventListener('click', () => {
          const show = !panel.getAttribute('visible');
          document.querySelectorAll('.panel').forEach((p) => p.setAttribute('visible', false));
          panel.setAttribute('visible', show);
        });
        this.el.addEventListener('mouseenter', () => this.el.setAttribute('scale', '1.25 1.25 1.25'));
        this.el.addEventListener('mouseleave', () => this.el.setAttribute('scale', '1 1 1'));
      },
    });

    // Niebla que avanza desde el mar
    AFRAME.registerComponent('neblina', {
      schema: { cantidad: { default: 60 } },
      init() {
        this.puffs = [];
        for (let i = 0; i < this.data.cantidad; i++) {
          const e = document.createElement('a-sphere');
          e.setAttribute('radius', 0.6 + Math.random() * 0.9);
          e.setAttribute('material', 'color: #ffffff; opacity: 0.12; transparent: true; shader: flat');
          e.object3D.position.set(-30 + Math.random() * 40, 2 + Math.random() * 3, -14 + Math.random() * 10);
          e.object3D.userData.v = 0.6 + Math.random() * 0.8;
          this.el.appendChild(e);
          this.puffs.push(e.object3D);
        }
      },
      tick(t, dt) {
        const s = dt / 1000;
        for (const p of this.puffs) {
          p.position.x += p.userData.v * s;
          if (p.position.x > 12) p.position.x = -30;
        }
      },
    });
  </script>
</head>
<body>
  <a-scene background="color: #cfd8dc" fog="type: linear; color: #e6ddcd; near: 10; far: 45"
           renderer="antialias: true">

    <a-assets>
      <!-- Audio ambiente opcional: agrega un archivo viento.mp3 a esta carpeta -->
      <audio id="viento" src="viento.mp3" preload="auto"></audio>
    </a-assets>

    <!-- Cámara con cursor de mirada: mirar 1.5 s sobre un hotspot equivale a un clic -->
    <a-entity position="0 1.6 0">
      <a-camera look-controls wasd-controls="enabled: false">
        <a-cursor raycaster="objects: .clickable" fuse="true" fuse-timeout="1500" color="#b5562e"
                  animation__fusing="property: scale; startEvents: fusing; from: 1 1 1; to: 0.3 0.3 0.3; dur: 1500"
                  animation__leave="property: scale; startEvents: mouseleave; to: 1 1 1; dur: 150"></a-cursor>
      </a-camera>
    </a-entity>

    <!-- Entorno: desierto, mar y cerros -->
    <a-plane rotation="-90 0 0" width="120" height="120" color="#d2b48a"></a-plane>
    <a-plane rotation="-90 0 0" width="60" height="120" position="-50 0.02 0" color="#4f7f96"></a-plane>
    <a-cone radius-bottom="9" radius-top="0" height="6" position="6 0 -16" color="#b98f62"></a-cone>
    <a-cone radius-bottom="12" radius-top="0" height="8" position="20 0 -10" color="#c8a77a"></a-cone>
    <a-cone radius-bottom="7" radius-top="0" height="5" position="-4 0 -22" color="#a87a52"></a-cone>
    <a-entity neblina="cantidad: 70"></a-entity>

    <!-- Atrapanieblas -->
    <a-entity position="0 0 -7">
      <a-cylinder radius="0.08" height="4.5" position="-2.5 2.25 0" color="#5b4636"></a-cylinder>
      <a-cylinder radius="0.08" height="4.5" position="2.5 2.25 0" color="#5b4636"></a-cylinder>
      <a-plane width="5" height="3" position="0 2.6 0" color="#22302a" opacity="0.55"
               material="side: double; transparent: true"></a-plane>
      <a-box width="5" height="0.15" depth="0.25" position="0 1.05 0" color="#9aa3a8"></a-box>
      <a-cylinder radius="0.7" height="1.2" position="3.6 0.6 0.8" color="#3d8fd1" opacity="0.8"></a-cylinder>
    </a-entity>

    <!-- Hotspots (esferas que se miran o se cliquean) y sus paneles -->
    <a-sphere class="clickable" radius="0.25" color="#b5562e" position="-3 2.2 -5"
              hotspot="panel: #p1"
              animation="property: material.opacity; from: 1; to: 0.5; dir: alternate; loop: true; dur: 900"></a-sphere>
    <a-entity id="p1" class="panel" position="-3 3.3 -4.8">
      <a-plane width="3.2" height="1.3" color="#f4ede1"></a-plane>
      <a-text value="La camanchaca\nNiebla costera del norte de Chile. Sus gotas son tan livianas que no caen como lluvia."
              color="#2b2420" width="3" position="-1.5 0 0.01" wrap-count="34"></a-text>
    </a-entity>

    <a-sphere class="clickable" radius="0.25" color="#b5562e" position="0 4.6 -6.5"
              hotspot="panel: #p2"
              animation="property: material.opacity; from: 1; to: 0.5; dir: alternate; loop: true; dur: 900"></a-sphere>
    <a-entity id="p2" class="panel" position="0 5.8 -6.3">
      <a-plane width="3.2" height="1.3" color="#f4ede1"></a-plane>
      <a-text value="Carlos Espinosa Arancibia\nFisico chileno. Tras la sequia de 1956 en Antofagasta ideo una malla para atrapar la niebla."
              color="#2b2420" width="3" position="-1.5 0 0.01" wrap-count="34"></a-text>
    </a-entity>

    <a-sphere class="clickable" radius="0.25" color="#b5562e" position="3.6 1.9 -5.8"
              hotspot="panel: #p3"
              animation="property: material.opacity; from: 1; to: 0.5; dir: alternate; loop: true; dur: 900"></a-sphere>
    <a-entity id="p3" class="panel" position="3.6 3 -5.6">
      <a-plane width="3.2" height="1.3" color="#f4ede1"></a-plane>
      <a-text value="Un regalo al mundo\nSu patente fue cedida a la UNESCO para que cualquier comunidad pudiera usarla libremente."
              color="#2b2420" width="3" position="-1.5 0 0.01" wrap-count="34"></a-text>
    </a-entity>

    <!-- Audio espacial: suena más fuerte cerca del mar (requiere viento.mp3) -->
    <a-entity position="-12 2 -6" sound="src: #viento; autoplay: true; loop: true; volume: 1.5; positional: true"></a-entity>

    <a-light type="ambient" intensity="0.7"></a-light>
    <a-light type="directional" position="5 10 4" intensity="0.9"></a-light>

    <a-text value="Mira fijo un punto naranja para descubrir la historia" align="center" color="#2b2420"
            width="6" position="0 0.6 -4"></a-text>
  </a-scene>
</body>
</html>
